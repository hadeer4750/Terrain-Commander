name: Build CarFinder IQ APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'carfinder-iq-android/**'
      - '.github/workflows/build-carfinder-iq.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p carfinder-iq-android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CarFinderIQ-APK
          path: carfinder-iq-android/app/build/outputs/apk/debug/app-debug.apk
