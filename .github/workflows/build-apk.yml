name: Build Terrain Commander APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: terrain-debug-signing-v1
      - name: Prepare stable test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Test voice command routing
        run: node tests/commands.cjs
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real local playback on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK signature and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          cp "$APK" Terrain-Commander-2.6.apk
          sha256sum Terrain-Commander-2.6.apk > Terrain-Commander-2.6.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Terrain-Commander-APK
          path: |
            Terrain-Commander-2.6.apk
            Terrain-Commander-2.6.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
