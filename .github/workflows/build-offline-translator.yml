name: Build Offline Translator APK

on:
  workflow_dispatch:
  push:
    branches:
      - offline-translator-v1
    paths:
      - 'OfflineTranslator/**'
      - '.github/workflows/build-offline-translator.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download offline models
        working-directory: OfflineTranslator
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/tessdata
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/models/qwen.gguf 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf?download=true'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/models/ggml-tiny.bin 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin?download=true'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/tessdata/fas.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/tessdata/ara.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata'
          test $(stat -c%s app/src/main/assets/models/qwen.gguf) -gt 300000000
          test $(stat -c%s app/src/main/assets/models/ggml-tiny.bin) -gt 50000000
          test $(stat -c%s app/src/main/assets/tessdata/fas.traineddata) -gt 100000
          test $(stat -c%s app/src/main/assets/tessdata/ara.traineddata) -gt 100000
          ls -lh app/src/main/assets/models app/src/main/assets/tessdata

      - name: Build debug APK
        working-directory: OfflineTranslator
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and rename APK
        run: |
          set -euxo pipefail
          test -f OfflineTranslator/app/build/outputs/apk/debug/app-debug.apk
          cp OfflineTranslator/app/build/outputs/apk/debug/app-debug.apk OfflineTranslator-v1.1-arm64.apk
          unzip -t OfflineTranslator-v1.1-arm64.apk >/dev/null
          unzip -l OfflineTranslator-v1.1-arm64.apk | grep 'assets/models/qwen.gguf'
          unzip -l OfflineTranslator-v1.1-arm64.apk | grep 'assets/models/ggml-tiny.bin'
          sha256sum OfflineTranslator-v1.1-arm64.apk | tee OfflineTranslator-v1.1-arm64.sha256
          ls -lh OfflineTranslator-v1.1-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-v1.1-arm64
          path: |
            OfflineTranslator-v1.1-arm64.apk
            OfflineTranslator-v1.1-arm64.sha256
          compression-level: 0
          retention-days: 7
