name: Build TriTranslate Offline V2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - offline-translator-v2-trilingual
    paths:
      - 'OfflineTranslator/**'
      - '.github/workflows/build-offline-translator.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download offline models
        working-directory: OfflineTranslator
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/tessdata
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/models/qwen.gguf 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf?download=true'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/models/ggml-small.bin 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/tessdata/fas.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/tessdata/ara.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata'
          curl -L --fail --retry 3 --retry-delay 2 -o app/src/main/assets/tessdata/eng.traineddata 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata'
          test $(stat -c%s app/src/main/assets/models/qwen.gguf) -gt 300000000
          test $(stat -c%s app/src/main/assets/models/ggml-small.bin) -gt 400000000
          test $(stat -c%s app/src/main/assets/tessdata/fas.traineddata) -gt 100000
          test $(stat -c%s app/src/main/assets/tessdata/ara.traineddata) -gt 100000
          test $(stat -c%s app/src/main/assets/tessdata/eng.traineddata) -gt 100000
          ls -lh app/src/main/assets/models app/src/main/assets/tessdata

      - name: Build APK
        working-directory: OfflineTranslator
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -f OfflineTranslator/app/build/outputs/apk/debug/app-debug.apk
          cp OfflineTranslator/app/build/outputs/apk/debug/app-debug.apk TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk
          unzip -t TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk >/dev/null
          unzip -l TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk | grep 'assets/models/qwen.gguf'
          unzip -l TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk | grep 'assets/models/ggml-small.bin'
          unzip -l TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk | grep 'assets/tessdata/eng.traineddata'
          sha256sum TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk | tee TriTranslate-Offline-V2.1-AR-EN-FA-arm64.sha256
          ls -lh TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriTranslate-Offline-V2.1-AR-EN-FA-arm64
          path: |
            TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk
            TriTranslate-Offline-V2.1-AR-EN-FA-arm64.sha256
          compression-level: 0
          retention-days: 7

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG='offline-translator-v2.1-conversation-camera'
          NOTES='TriTranslate Offline V2.1: Arabic + English + Persian offline translation, Whisper Small, automatic two-way conversation handoff, repeat prompt for unclear speech, manual IQD/IRR/USD exchange rates, full-resolution price camera, enhanced offline OCR and banknote count. Designed by Hadeer Al-Khafaji © 2026.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk TriTranslate-Offline-V2.1-AR-EN-FA-arm64.sha256 --clobber
          else
            gh release create "$TAG" TriTranslate-Offline-V2.1-AR-EN-FA-arm64.apk TriTranslate-Offline-V2.1-AR-EN-FA-arm64.sha256 \
              --target "$GITHUB_SHA" \
              --title 'TriTranslate Offline V2.1 — Conversation + Camera' \
              --notes "$NOTES"
          fi
