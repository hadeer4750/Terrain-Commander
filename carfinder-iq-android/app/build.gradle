plugins {
    id 'com.android.application'
}

android {
    namespace 'iq.carfinder.app'
    compileSdk 35

    defaultConfig {
        applicationId 'iq.carfinder.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/fbbridge.aar')
}
